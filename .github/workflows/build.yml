# Builds the Windows installer and the portable zip on GitHub's Windows machines.
# Every push: both files are attached to the run (Actions tab -> the run -> Artifacts).
# Pushing a tag like v1.1.0 also attaches them to a GitHub Release.
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install PySide6-Essentials pywin32 pillow pyinstaller pefile

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import viberblur; print(viberblur.VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build the app folder (PyInstaller)
        shell: pwsh
        run: |
          ./tools/build.ps1
          if (-not (Test-Path dist\ViberPrivacyBlur\ViberPrivacyBlur.exe)) { throw "build produced no exe" }

      - name: Smoke test the built exe
        continue-on-error: true
        shell: pwsh
        run: |
          $env:VIBERBLUR_SELFTEST = "$PWD\selftest"
          $p = Start-Process -FilePath dist\ViberPrivacyBlur\ViberPrivacyBlur.exe -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw "self-test timed out" }
          if (-not (Test-Path selftest\overlay.png)) { throw "self-test produced no overlay.png" }

      - name: Make the portable zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force installer, portable | Out-Null
          Copy-Item -Recurse dist\ViberPrivacyBlur portable\ViberPrivacyBlur
          Copy-Item README.md, LICENSE portable\ViberPrivacyBlur\
          Set-Content portable\ViberPrivacyBlur\portable.txt "Portable mode: settings are kept in the data folder next to this file. Delete this file to keep them in %LOCALAPPDATA%\ViberPrivacyBlur instead."
          Compress-Archive -Path portable\ViberPrivacyBlur -DestinationPath "installer\ViberPrivacyBlur-Portable-$v.zip"

      - name: Make the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: ViberPrivacyBlur-${{ steps.ver.outputs.version }}
          path: |
            installer/*.exe
            installer/*.zip
          if-no-files-found: error

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/*.exe
            installer/*.zip
